<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · Socially</title><link rel="stylesheet" href="/style.css"><style>
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-box{width:100%;max-width:380px;background:#fff;border:1px solid #ddd;padding:32px;border-radius:12px;text-align:center;box-shadow:0 12px 36px #00000008}.login-box .brand{margin-bottom:4px}.login-box p{color:#777;font-size:14px;line-height:1.5}.login-box input{display:block;width:100%;height:44px;margin:12px 0;padding:0 12px;border:1px solid #ddd;border-radius:6px;background:#fafafa;font-size:14px}.login-box button{width:100%;height:40px;border:0;border-radius:7px;background:#3897f0;color:white;font-weight:bold;cursor:pointer}.login-box button:disabled{opacity:.6}.login-box .message{min-height:20px;font-size:13px;color:#555}.login-box a{color:#1677c8;text-decoration:none;font-size:13px}
</style></head><body><main class="login-wrap"><section class="login-box"><div class="brand">socially</div><h2>Sign in to your account</h2><p>We'll send a one-time sign-in code to your email. You don't need to create or remember a password.</p><form id="signin"><label class="sr-only" for="email">Email address</label><input id="email" type="email" placeholder="Email address" autocomplete="username webauthn" required><div id="code-row" hidden><label class="sr-only" for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button id="submit" type="submit">Send sign-in code</button></form><p class="message" id="message" role="status" aria-live="polite"></p><a href="/">Back to home</a></section></main><script>
(function(){const A=window.hatchable&&window.hatchable.auth;const form=document.getElementById('signin');const email=document.getElementById('email');const code=document.getElementById('code');const row=document.getElementById('code-row');const submit=document.getElementById('submit');const message=document.getElementById('message');let step='email';function say(t){message.textContent=t||'';}function nextPath(){const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/';}if(!A){say('Sign-in is temporarily unavailable. Please refresh.');submit.disabled=true;return;}A.getSession().then(s=>{if(s&&s.user)location.replace('/');}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;say('');try{if(step==='email'){await A.startLogin({email:email.value.trim()});step='code';row.hidden=false;email.readOnly=true;submit.textContent='Verify and sign in';say('Check your email for the one-time code.');code.required=true;code.focus();}else{const result=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!result||!result.user)throw new Error('That code could not be verified. Try again.');await fetch('/api/account/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).then(async r=>{if(!r.ok)throw new Error('Signed in, but your profile could not be saved. Please retry.');return r.json();});location.replace(nextPath());}}catch(err){say(err&&err.message?err.message:'Something went wrong. Please try again.');}finally{submit.disabled=false;}});})();
</script></body></html>
